{% extends "base.html" %}
{% block title %}Add User{% endblock %}
{% block content %}
<h3 class="page-title mb-3">Add User</h3>
<form method="post" class="card shadow-sm p-4" style="max-width:500px">
  <div class="mb-3"><label class="form-label">Full Name</label><input name="full_name" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">Password (min 6 chars)</label><input type="password" name="password" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">Role</label><select name="role" class="form-select">{% for r in ROLES %}<option>{{ r }}</option>{% endfor %}</select></div>
  <button class="btn btn-primary">Create</button> <a href="{{ url_for('users') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
