{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="page-title text-center mb-1">💊 PharmaTrack</h3>
        <p class="text-center text-muted">Pharmacy Stock &amp; Medicine Expiry Tracking</p>
        <form method="post">
          <div class="mb-3"><label class="form-label">Username</label>
            <input name="username" class="form-control" required autofocus></div>
          <div class="mb-3"><label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required></div>
          <button class="btn btn-primary w-100">Login</button>
        </form>
        <hr>
        <small class="text-muted">Demo logins:<br>
          admin / admin123<br>pharmacist / pharma123<br>manager / manager123</small>
      </div>
    </div>
  </div>
</div>
{% endblock %}
