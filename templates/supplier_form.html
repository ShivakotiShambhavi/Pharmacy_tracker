{% extends "base.html" %}
{% block title %}Supplier{% endblock %}
{% block content %}
<h3 class="page-title mb-3">{{ 'Edit' if sup else 'Add' }} Supplier</h3>
<form method="post" class="card shadow-sm p-4" style="max-width:700px">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Supplier Name *</label><input name="name" class="form-control" required value="{{ sup.name if sup }}"></div>
    <div class="col-md-6"><label class="form-label">Contact Person</label><input name="contact_person" class="form-control" value="{{ sup.contact_person if sup }}"></div>
    <div class="col-md-6"><label class="form-label">Phone</label><input name="phone" class="form-control" value="{{ sup.phone if sup }}"></div>
    <div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ sup.email if sup }}"></div>
    <div class="col-12"><label class="form-label">Address</label><input name="address" class="form-control" value="{{ sup.address if sup }}"></div>
  </div>
  <div class="mt-4"><button class="btn btn-primary">Save</button> <a href="{{ url_for('suppliers') }}" class="btn btn-secondary">Cancel</a></div>
</form>
{% endblock %}
