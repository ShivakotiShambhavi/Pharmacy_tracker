{% extends "base.html" %}
{% block title %}Medicine{% endblock %}
{% block content %}
<h3 class="page-title mb-3">{{ 'Edit' if med else 'Add' }} Medicine</h3>
<form method="post" class="card shadow-sm p-4" style="max-width:700px">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Medicine Name *</label><input name="name" class="form-control" required value="{{ med.name if med }}"></div>
    <div class="col-md-6"><label class="form-label">Generic Name</label><input name="generic_name" class="form-control" value="{{ med.generic_name if med }}"></div>
    <div class="col-md-6"><label class="form-label">Category</label><input name="category" class="form-control" value="{{ med.category if med }}"></div>
    <div class="col-md-6"><label class="form-label">Unit</label><input name="unit" class="form-control" value="{{ med.unit if med else 'Strips' }}"></div>
    <div class="col-md-6"><label class="form-label">Reorder Level (low-stock alert)</label><input type="number" min="0" name="reorder_level" class="form-control" value="{{ med.reorder_level if med else 20 }}"></div>
    <div class="col-md-6"><label class="form-label">Selling Price (₹)</label><input type="number" step="0.01" min="0" name="price" class="form-control" value="{{ med.price if med else 0 }}"></div>
  </div>
  <div class="mt-4"><button class="btn btn-primary">Save</button> <a href="{{ url_for('medicines') }}" class="btn btn-secondary">Cancel</a></div>
</form>
{% endblock %}
