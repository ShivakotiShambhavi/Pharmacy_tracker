{% extends "base.html" %}
{% block title %}New Purchase{% endblock %}
{% block content %}
<h3 class="page-title mb-3">Record Purchase / Stock Inward</h3>
<form method="post" class="card shadow-sm p-4" style="max-width:800px">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Medicine *</label>
      <select name="medicine_id" class="form-select" required><option value="">-- select --</option>
      {% for m in meds %}<option value="{{ m.id }}">{{ m.name }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label">Supplier *</label>
      <select name="supplier_id" class="form-select" required><option value="">-- select --</option>
      {% for s in sups %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Batch No *</label><input name="batch_no" class="form-control" required></div>
    <div class="col-md-4"><label class="form-label">Expiry Date *</label><input type="date" name="expiry_date" min="{{ today }}" class="form-control" required></div>
    <div class="col-md-4"><label class="form-label">Invoice No</label><input name="invoice_no" class="form-control"></div>
    <div class="col-md-4"><label class="form-label">Quantity *</label><input type="number" min="1" name="quantity" class="form-control" required></div>
    <div class="col-md-4"><label class="form-label">Unit Cost (₹) *</label><input type="number" step="0.01" min="0" name="unit_cost" class="form-control" required></div>
    <div class="col-md-4"><label class="form-label">Purchase Date</label><input type="date" name="purchase_date" value="{{ today }}" class="form-control"></div>
  </div>
  <div class="mt-4"><button class="btn btn-primary">Save Purchase</button> <a href="{{ url_for('purchases') }}" class="btn btn-secondary">Cancel</a></div>
</form>
{% endblock %}
