{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<div class="d-flex justify-content-between mb-3"><h3 class="page-title">User Management</h3>
<a href="{{ url_for('user_add') }}" class="btn btn-primary">+ Add User</a></div>
<div class="card shadow-sm"><table class="table mb-0"><thead><tr><th>Username</th><th>Full Name</th><th>Role</th><th></th></tr></thead>
<tbody>{% for u in rows %}<tr><td>{{ u.username }}</td><td>{{ u.full_name }}</td><td><span class="badge bg-info text-dark">{{ u.role }}</span></td>
<td><form method="post" action="{{ url_for('user_delete', uid=u.id) }}" onsubmit="return confirm('Delete user?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>
{% endfor %}</tbody></table></div>
{% endblock %}
